<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwin Yadav</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #667eea, #764ba2);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  color: white;
}

/* CARD */
.card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 30px 20px;
  width: 90%;
  max-width: 350px;
  text-align: center;
  box-shadow: 0 0 30px rgba(0,0,0,0.4);
}

/* PROFILE IMAGE */
.profile {
  width: 30pxpx;
  height: 30px;
  border-radius: 50%;
  object-fit: cover;
  margin: auto;
  display: block;
  border: 3px solid white;
  box-shadow: 0 0 20px rgba(255,255,255,0.5);
}

/* TEXT */
h1 {
  margin: 15px 0 5px;
  font-size: 24px;
}

p {
  font-size: 14px;
  opacity: 0.85;
  margin-bottom: 20px;
}

/* BUTTONS */
.btn {
  display: block;
  margin: 12px 0;
  padding: 14px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

/* BUTTON COLORS */
.telegram {
  background: #0088cc;
  color: white;
}

.telegram:hover {
  background: #0077b5;
  transform: scale(1.05);
}

.vip {
  background: gold;
  color: black;
}

.whatsapp {
  background: #25D366;
  color: black;
}

.footer {
  margin-top: 15px;
  font-size: 12px;
  opacity: 0.7;
}
</style>

</head>

<body>

<div class="card">

  <!-- PROFILE IMAGE -->

  <img src="logo.jpg" alt="profile" class="profile">

  <h1>Ashwin Yadav</h1>
  <p>Official Channel 🚀</p>

  <!-- BUTTONS -->

  <a class="btn telegram" href="https://t.me/+EN2J4lr9DOtmOTc9" target="_blank">
    Join Telegram 🔥
  </a>

  <a class="btn vip" href="#">
    VIP Access 💎
  </a>

  <a class="btn whatsapp" href="#">
    Contact Now 📞
  </a>

  <div class="footer">
    © 2026 Ashwin Yadav
  </div>

</div>

</body>
</html>
