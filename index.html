<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashwin Yadav</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: radial-gradient(circle at top, #1f1c2c, #928dab);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: white;
}

/* CARD /
.card {
  background: rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 30px 20px;
  width: 90%;
  max-width: 360px;
  text-align: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
}

/ IMAGE LOGO /
.logo {
  width: 90px;
  height: 90px;
  margin: auto;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid white;
}

/ IMAGE /
.logo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/ FALLBACK TEXT /
.logo-text {
  display: none;
  width: 90px;
  height: 90px;
  margin: auto;
  border-radius: 50%;
  background: gold;
  color: black;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
}

/ TEXT /
h1 {
  margin: 15px 0 5px;
}

p {
  font-size: 13px;
  opacity: 0.8;
  margin-bottom: 20px;
}

/ BUTTONS */
.btn {
  display: block;
  margin: 12px 0;
  padding: 13px;
  border-radius: 12px;
  text-decoration: none;
  font-weight: bold;
  transition: 0.3s;
}

.telegram {
  background: #0088cc;
  color: white;
}

.telegram:hover {
  transform: scale(1.06);
}

.vip {
  background: gold;
  color: black;
}

.whatsapp {
  background: #25D366;
  color: black;
}

.footer {
  margin-top: 15px;
  font-size: 12px;
  opacity: 0.6;
}
</style>
</head>

<body>

<div class="card">

  <!-- IMAGE LOGO -->
  <div class="logo">
    <img src="logo.jpg" alt="logo" onerror="this.style.display='none'; document.getElementById('fallback').style.display='flex';">
  </div>

  <!-- FALLBACK -->
  <div id="fallback" class="logo-text">AY</div>

  <h1>Ashwin Yadav</h1>
  <p>Official Channel 🚀</p>

  <a class="btn telegram" href="https://t.me/+EN2J4lr9DOtmOTc9" target="_blank">
    Join Telegram 🔥
  </a>

  <a class="btn vip" href="#">
    VIP Access 💎
  </a>

  <a class="btn whatsapp" href="#">
    Contact Now 📞
  </a>

  <div class="footer">
    © 2026 Ashwin Yadav
  </div>

</div>

</body>
</html>
